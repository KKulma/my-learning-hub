<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Vertical team structure</title>
  <desc id="desc">UI, SOA, and Data layers each span Email, Voice, and TV teams.</desc>
  <rect width="760" height="330" fill="#bdd9ef"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g fill="#f2f2f2" stroke="#d1d1d1">
      <rect x="40" y="45" width="115" height="55"/><rect x="40" y="137" width="115" height="55"/><rect x="40" y="229" width="115" height="55"/>
    </g>
    <g fill="#74ed3d" stroke="#52c921">
      <rect x="205" y="45" width="130" height="55"/><rect x="365" y="45" width="130" height="55"/><rect x="525" y="45" width="130" height="55"/>
      <rect x="205" y="137" width="130" height="55"/><rect x="365" y="137" width="130" height="55"/><rect x="525" y="137" width="130" height="55"/>
      <rect x="205" y="229" width="130" height="55"/><rect x="365" y="229" width="130" height="55"/><rect x="525" y="229" width="130" height="55"/>
    </g>
    <g fill="#222">
      <text x="98" y="80">UI</text><text x="98" y="172">SOA</text><text x="98" y="264">Data</text>
      <text x="270" y="80">Email</text><text x="430" y="80">Voice</text><text x="590" y="80">TV</text>
      <text x="270" y="172">Email</text><text x="430" y="172">Voice</text><text x="590" y="172">TV</text>
      <text x="270" y="264">Email</text><text x="430" y="264">Voice</text><text x="590" y="264">TV</text>
    </g>
  </g>
  <g fill="#8c83ff" stroke="#4f46c5" stroke-width="3">
    <path d="M190 25h470l-18-14v28z"/><path d="M190 117h470l-18-14v28z"/><path d="M190 209h470l-18-14v28z"/>
  </g>
</svg>
